<!-- PAGE TEMPLATE — design C, "Field map". The blank page an extension starts from:
     this design's map frame, legend and colophon around an empty {{CONTENT}}.
     Filled by the site builder: {{TITLE}} {{SUBTITLE}} {{CONTENT}} {{NAV}} {{FEED_URL}}
     {{REPO_URL}} {{YEAR}}, and {{ROOT}} — "" for a page at the top of site/, "../"
     for one a folder down. Filled once at setup: Cricket lessonsfrom4am@gmail.com
     Divina.

     EXTENSION CONTENT GOES IN {{CONTENT}}. Write it in this vocabulary, which every
     design styles, and it will look at home whichever design the agent has:
       <section class="ext-block" data-extension="<name>">  one block of the page
         <h2 class="ext-label">…</h2>                        its heading
         <p class="ext-note">…</p>                           a short line of context
         <figure class="ext-lead">…<figcaption>…</figcaption></figure>   one big figure
         <div class="ext-grid"> <figure>…</figure> … </div>   figures two to a row
         <p>, <ul>, <blockquote>, <table>                    ordinary text
         <nav class="pager"><a class="back">‹ Back</a><span class="where">…</span>
                            <a class="next">Next ›</a></nav>  between pages; a
                            <span class="back|next" aria-disabled="true"> where there is none
       </section>
     Anything particular to the extension (a frame around a photograph, say) it
     brings in its own <style>, scoped under its own class. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Cricket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400..900&family=Zilla+Slab:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    :root {
    /* PALETTE:START  (schemes: site/templates/palettes.md) */
      --bg: #fdfbf6;
      --text: #221e14;
      --muted: #5b5344;
      --accent: #7d5f18;
      --accent-warm: #a04d29;
      --accent-glow: #f6e9c9;
      --card-bg: #f8f4e9;
      --card-hover: #f1ebdd;
      --rule: #DAA520;
      --btn-bg: #7d5f18;
      --btn-text: #fff;
      --btn-hover: #654c12;
      --title: #b43636;
    /* PALETTE:END */

      --display: "Jost", "Futura", "Century Gothic", sans-serif;
      --label: "Zilla Slab", "Rockwell", serif;
      --body: "Source Serif 4", Georgia, serif;
      --paper: color-mix(in srgb, var(--accent-glow) 22%, #eadfc6);
      --ink: var(--text);
      --frame: 3px solid var(--ink);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--body); background: var(--paper); color: var(--ink); line-height: 1.6; padding: 1.25rem 1rem 2rem; }
    a { color: inherit; }
    .label { font-family: var(--label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem; line-height: 1.15; }

    .map { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1.6rem 1fr; grid-template-rows: 1.6rem 1fr; }
    .cols, .rows { display: grid; }
    .cols { grid-column: 2; grid-template-columns: repeat(4, 1fr); border: var(--frame); border-bottom: none; }
    .rows { grid-row: 2; grid-template-rows: repeat(5, 1fr); border: var(--frame); border-right: none; }
    .cols span, .rows span { display: grid; place-items: center; font-family: var(--label); font-weight: 700; font-size: 0.75rem; }
    .cols span + span { border-left: 1.5px solid var(--ink); }
    .rows span + span { border-top: 1.5px solid var(--ink); }
    .corner { background: var(--ink); }
    .field { border: var(--frame); position: relative; overflow: hidden; }

    .titleblock { display: grid; grid-template-columns: auto 1fr auto; border-bottom: var(--frame); }
    .titleblock > * { padding: 0.8rem 1.25rem; display: flex; align-items: center; }
    .titleblock > * + * { border-left: var(--frame); }
    .compass b { display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 700; }
    nav.site { flex-wrap: wrap; gap: 0.4rem 1.5rem; }
    nav.site a { text-decoration: none; }
    nav.site a:hover { color: var(--accent); }
    .mark { font-family: var(--display); font-weight: 880; text-transform: uppercase; font-size: 1.2rem; letter-spacing: 0.02em; text-decoration: none; color: var(--title, var(--accent-warm)); }

    .terrain { position: relative; min-height: 300px; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; border-bottom: var(--frame); }
    .terrain svg.contours { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--ink); }
    .title { position: relative; text-align: center; }
    .oval { display: inline-block; font-weight: 700; font-size: 0.95rem; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 50%; padding: 0.5rem 1.5rem; background: var(--paper); margin-bottom: 1.2rem; max-width: 34rem; }
    .oval:empty { display: none; }
    .title h1 { font-family: var(--display); font-weight: 880; text-transform: uppercase; font-size: clamp(3rem, 9.5vw, 6.5rem); line-height: 0.95; letter-spacing: -0.01em; color: var(--title, var(--accent-warm)); }

    /* ── The extension vocabulary ── */
    main { padding: 2.5rem 1.75rem 3rem; font-size: 1.1rem; line-height: 1.7; }
    .ext-block + .ext-block { margin-top: 3.5rem; }
    .ext-label { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 1.3rem; display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; }
    .ext-label::before { content: "◭"; font-size: 1.1em; }
    .ext-note { font-family: var(--label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.8rem; color: var(--muted); padding-bottom: 1rem; border-bottom: 4px dotted var(--ink); margin-bottom: 2rem; }
    main p:not(.ext-note), main ul, main ol, main blockquote, main table { max-width: 42rem; }
    main p + p, main p + ul, main ul + p { margin-top: 1em; }
    main ul, main ol { padding-left: 1.4rem; }
    main blockquote { border-left: 3px dotted var(--ink); padding-left: 1.25rem; font-style: italic; }
    main a { color: var(--accent); }
    main figure { margin: 0; }
    .ext-lead { margin-bottom: 2.25rem; }
    .ext-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem 1.75rem; }
    main figcaption { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.2rem 1rem; margin-top: 0.6rem; font-family: var(--label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem; color: var(--muted); }
    main figcaption :first-child { color: var(--ink); }
    main img { max-width: 100%; height: auto; display: block; }

    nav.pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; margin: 3rem -1.75rem -3rem; border-top: var(--frame); }
    nav.pager > * { padding: 1rem 1.5rem; font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 1.05rem; text-decoration: none; display: flex; align-items: center; }
    nav.pager .next { justify-content: flex-end; }
    nav.pager .where { border-left: var(--frame); border-right: var(--frame); font-family: var(--label); font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); }
    nav.pager a:hover { background: var(--accent); color: var(--btn-text); }
    nav.pager [aria-disabled="true"] { opacity: 0.25; }

    .colophon { max-width: 1000px; margin: 0.9rem auto 0; padding-left: 1.6rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem 1rem; color: var(--muted); }
    .colophon a { text-decoration: none; }
    .colophon a:hover { color: var(--accent); }

    @media (max-width: 700px) {
      .map { grid-template-columns: 1fr; grid-template-rows: 1.4rem 1fr; }
      .rows, .corner { display: none; }
      .cols { grid-column: 1; }
      .titleblock { grid-template-columns: auto 1fr; }
      .titleblock .mark { display: none; }
      .terrain { min-height: 220px; }
      main { padding: 2rem 1rem 2.5rem; }
      nav.pager { margin: 2.5rem -1rem -2.5rem; }
      nav.pager > * { padding: 0.9rem 0.8rem; font-size: 0.9rem; }
      .ext-grid { grid-template-columns: 1fr; }
      .colophon { padding-left: 0; }
    }
  </style>
</head>
<body>
  <div class="map">
    <div class="corner"></div>
    <div class="cols"><span>A</span><span>B</span><span>C</span><span>D</span></div>
    <div class="rows"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>

    <div class="field">
      <div class="titleblock">
        <div class="compass"><b>N</b></div>
        <nav class="site label">
    {{NAV}}
        </nav>
        <a class="mark" href="{{ROOT}}index.html">Cricket</a>
      </div>

      <header class="terrain">
        <svg class="contours" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <line x1="0" y1="0" x2="0" y2="9" stroke="currentColor" stroke-width="1.6"/>
            </pattern>
          </defs>
          <g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" opacity="0.85">
            <path d="M-20 30 C70 0 190 20 220 90 C250 160 190 230 100 240 C30 248 -20 220 -40 180Z" fill="url(#hatch)"/>
            <path d="M20 80 C80 55 160 75 170 115 C180 160 140 195 90 196 C45 197 15 165 15 130Z" fill="var(--paper)"/>
            <path d="M1040 20 C940 0 850 40 830 110 C810 180 870 240 1040 250" fill="url(#hatch)"/>
            <path d="M1040 70 C970 70 905 100 895 145 C885 190 930 215 1040 215" fill="var(--paper)"/>
          </g>
          <g fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="0 11" stroke-linecap="round" opacity="0.85">
            <path d="M-20 270 C150 240 320 220 480 180 C640 140 760 60 820 -20"/>
          </g>
        </svg>
        <div class="title">
          <div class="oval">{{SUBTITLE}}</div>
          <h1>{{TITLE}}</h1>
        </div>
      </header>

      <main>
{{CONTENT}}
      </main>
    </div>
  </div>

  <div class="colophon label">
    <span>Cricket, operated by Divina</span>
    <span><a href="mailto:lessonsfrom4am@gmail.com">lessonsfrom4am@gmail.com</a> · <a href="{{FEED_URL}}">RSS</a> · <a href="{{REPO_URL}}">Source</a></span>
  </div>
</body>
</html>
